<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WoW Companion</title>
  <meta name="description" content="Tier lists, builds, talents, gear and leveling tips for World of Warcraft in one place.">
  <meta name="theme-color" content="#110f24">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z"/></svg>
        WoW Companion
      </a>
      <nav class="versions" aria-label="Game version" id="versionNav"></nav>
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="sectionNav">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span>Menu</span>
      </button>
      <nav class="sections" aria-label="Sections" id="sectionNav"></nav>
      <button class="search-btn" id="searchBtn" type="button" aria-label="Search (press /)" aria-haspopup="dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"/></svg>
        <span>Search</span><kbd>/</kbd>
      </button>
    </div>
  </header>
  <div id="setupBanner" class="setup-banner" hidden></div>
  <main id="main" tabindex="-1"></main>
  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-box" role="dialog" aria-modal="true" aria-labelledby="searchLabel">
      <label id="searchLabel" for="searchInput" class="sr">Search WoW Companion</label>
      <div class="search-field">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"/></svg>
        <input id="searchInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search specs, talents, bosses, abilities, characters…" role="combobox" aria-expanded="true" aria-controls="searchResults" aria-autocomplete="list">
        <button type="button" class="sheet-close" id="searchClose" aria-label="Close search">✕</button>
      </div>
      <ul id="searchResults" class="search-results" role="listbox" aria-label="Results"></ul>
      <p class="search-hint muted small">↑ ↓ to move · Enter to open · Esc to close</p>
    </div>
  </div>
  <footer class="foot">
    <p>Game data from the Blizzard Battle.net API. World of Warcraft is a trademark of Blizzard Entertainment; this personal fan app isn't affiliated with Blizzard.</p>
  </footer>

  <script src="config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/talents.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
